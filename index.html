            padding: 24px;
            margin-bottom: 20px;

        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-azul { background: #2563eb; color: white; }
        .btn-azul:hover { background: #1d4ed8; }

        .btn-gris { background: #64748b; color: white; }
        .btn-gris:hover { background: #475569; }

        .btn-verde { background: #10b981; color: white; }
        .btn-verde:hover { background: #059669; }

        .busqueda {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin: 24px 0;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #334155;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
            transform: translateY(-2px);
            transition: transform 0.2s ease;
        }

        .botones-busqueda {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .contacto {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 8px solid;
        }

        .encabezado {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .nombre {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .dato {
            font-size: 16px;
            margin: 6px 0;
            color: #475569;
        }

        .enlace-tel {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 6px 0;
        }

        .enlace-wa {
            color: #16a34a;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 6px 0 6px 16px;
        }

        .botones-accion {

            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

            border: none;
            border-radius: 8px;
            background: #e2e8f0;
            color: #1e293b;
