<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba Contactos</title>
<style>
  body{font-family:Arial,sans-serif;background:#f2f4f7;margin:0;padding:16px}
  .box{max-width:420px;margin:auto;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0002}
  h2{margin-top:0}
  input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;font-size:16px;border-radius:8px;border:1px solid #bbb}
  button{border:none;color:#fff;background:#1a73e8}
  button:disabled{background:#9ab}
  #guardar{background:#188038}
  #msg{margin-top:14px;padding:10px;border-radius:8px;background:#eef;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="box">
  <h2>Prueba: guardar contacto</h2>
  <button id="conectar" disabled>Cargando Google...</button>
  <input id="nombre" placeholder="Nombre">
  <input id="telefono" placeholder="Teléfono" inputmode="tel">
  <button id="guardar" disabled>Guardar en la hoja</button>
  <div id="msg">Esperando...</div>
</div>

<script>
const CLIENT_ID = '954568750819-am04it2kt0pb8oiiijilcgdoo8nptuu7.apps.googleusercontent.com';
const SHEET_ID  = '1DbCMAN9ja3AdSLbexTH8cGxuYGpwSJ33MbfAtHNyIEQ';
const SCOPE     = 'https://www.googleapis.com/auth/spreadsheets';

let tokenClient = null;
let accessToken = null;
let vence = 0;

const $ = id => document.getElementById(id);
const msg = t => $('msg').textContent = t;

function tokenValido(){ return accessToken && Date.now() < vence; }

function actualizarBotones(){
  $('guardar').disabled = !tokenValido();
  $('conectar').textContent = tokenValido() ? 'Conectado ✔ (tocar para reconectar)' : 'Conectar con Google';
}

// Se llama cuando carga la librería de Google
function iniciarGoogle(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: (resp) => {
      if (resp.error) { msg('Error de Google: ' + resp.error); return; }
      accessToken = resp.access_token;
      vence = Date.now() + (resp.expires_in - 60) * 1000;
      msg('Conectado. Ya puedes guardar.');
      actualizarBotones();
    },
    error_callback: (err) => {
      if (err.type === 'popup_failed_to_open') msg('El navegador bloqueó la ventana. Toca otra vez el botón.');
      else if (err.type === 'popup_closed') msg('Cerraste la ventana de Google.');
      else msg('Error: ' + (err.type || 'desconocido'));
    }
  });
  $('conectar').disabled = false;
  $('conectar').textContent = 'Conectar con Google';
  msg('Toca "Conectar con Google".');
}

// El login SOLO se abre con un toque del usuario
$('conectar').addEventListener('click', () => {
  if (!tokenClient) return;
  tokenClient.requestAccessToken({ prompt: tokenValido() ? '' : 'select_account' });
});

$('guardar').addEventListener('click', async () => {
  const nombre = $('nombre').value.trim();
  const telefono = $('telefono').value.trim();
  if (!nombre || !telefono) { msg('Escribe nombre y teléfono.'); return; }
  if (!tokenValido()) { msg('La sesión venció. Toca "Conectar con Google".'); actualizarBotones(); return; }

  $('guardar').disabled = true;
  msg('Guardando...');
  try {
    const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID +
      '/values/A:C:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS';
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[new Date().toLocaleString('es-PE'), nombre, telefono]] })
    });
    if (r.status === 401) { accessToken = null; msg('La sesión venció. Toca "Conectar con Google".'); }
    else if (!r.ok) { const e = await r.json(); msg('Error ' + r.status + ': ' + (e.error && e.error.message || '')); }
    else { msg('✔ Guardado en la hoja.'); $('nombre').value = ''; $('telefono').value = ''; }
  } catch (e) {
    msg('Error de conexión: ' + e.message);
  }
  actualizarBotones();
});
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="iniciarGoogle()"></script>
</body>
</html>
